name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit test + integration test (Testcontainers dùng Docker có sẵn trên runner)
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t donation-platform:ci .
