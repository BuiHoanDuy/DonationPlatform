spring:
  config:
    # Đọc file .env ở thư mục chạy (nếu có) khi phát triển local. Không có file thì bỏ qua.
    # Biến môi trường thật của hệ điều hành / Docker luôn ưu tiên hơn file này.
    import: "optional:file:.env[.properties]"
  application:
    name: donation-platform
  datasource:
    # Ưu tiên DB_*; nếu không có thì dùng POSTGRES_* trong .env (cùng file với docker compose)
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:donation_db}}
    username: ${DB_USERNAME:${POSTGRES_USER:donation}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}   # không có mặc định: bắt buộc cấu hình, không commit mật khẩu
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate               # schema do Flyway quản lý, Hibernate chỉ kiểm tra khớp
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
